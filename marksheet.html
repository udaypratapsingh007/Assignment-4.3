<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Marksheet</title>
  </head>
  <body>

          <th rowspan="2">Total (out of 300)</th>
        </tr>
        <tr>
          <th>Maths</th>
          <th>Science</th>
          <th>English</th>
        </tr>
      </thead>

      <!-- Table body -->
      <tbody>
        <tr>
          <td>1</td>
          <td>Aman</td>
          <td>85</td>
          <td>78</td>
          <td>90</td>
          <td>253</td>
        </tr>
        <tr>
          <td>2</td>
          <td>Riya</td>
          <td>92</td>
          <td>88</td>
          <td>79</td>
          <td>259</td>
        </tr>
        <tr>
          <td>3</td>
          <td>Karan</td>
          <td>67</td>
          <td>74</td>
          <td>81</td>
          <td>222</td>

        <tr>
          <td>4</td>
          <td>Sneha</td>
          <td>88</td>
          <td>91</td>
          <td>85</td>
          <td>264</td>
        </tr>
        <tr>
          <td>5</td>
          <td>Rahul</td>
          <td>73</td>
          <td>69</td>
          <td>77</td>
          <td>219</td>
        </tr>
      </tbody>

      <!-- Table footer with averages -->
      <tfoot>
        <tr>
          <th colspan="2">Class Average</th>
          <td>81</td>
          <td>80</td>
          <td>82.4</td>
          <td>243.4</td>
        </tr>
      </tfoot>
    </table>
  </body>
</html>
